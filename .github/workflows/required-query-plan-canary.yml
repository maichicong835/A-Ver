name: A-Ver Required Query Plan Canary

on:
  push:
    branches: [main]
    paths:
      - 'src/aver/query_plan.py'
      - 'src/aver/required_query_plan_canary.py'
      - 'src/aver/material_record_priority.py'
      - 'src/aver/record_interpretation.py'
      - 'src/aver/resolvers/trademarkia.py'
      - '.github/workflows/required-query-plan-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-required-query-plan-canary
  cancel-in-progress: false

env:
  EXTERNAL_SIDE_EFFECTS_AUTHORIZED: 'false'
  DAILY7_LIVE_GATE_AUTHORIZED: 'false'
  TM_DECISION_AUTHORIZED: 'false'

jobs:
  query-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify authority locks
        shell: bash
        run: |
          set -euo pipefail
          test "$EXTERNAL_SIDE_EFFECTS_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          test "$TM_DECISION_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['status']=='PRODUCTION_APPROVED_SCOPED'
          assert c['current_reopen_scope']['only_layer']=='SHADOW_DEEP_TM_INTERPRETATION'
          assert c['current_reopen_scope']['new_candidate_or_market_discovery_forbidden'] is True
          assert c['current_reopen_scope']['only_existing_hold_canaries_authorized'] is True
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          print('AVER_QUERY_PLAN_LOCK_PASS')
          PY
      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then echo "AVER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"; else python3 -m playwright install chromium; fi
      - name: Execute required query-plan canary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/required_query_plan_canary.py
      - name: Upload immutable query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aver-required-query-plan-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/query-plan/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Assert honest incomplete-scope semantic pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/query-plan/receipt.json'))
          assert r['phase_state']=='QUERY_PLAN_EXECUTION_PASS_SCOPE_INCOMPLETE'
          assert r['shadow_only'] is True
          assert r['candidate_breadth_expanded'] is False
          assert r['tm_decision_authorized'] is False
          assert r['daily7_live_gate_authorized'] is False
          assert all(x['required_query_dimensions_complete'] is False for x in r['canaries'])
          assert all(x['federal_negative_clearance_scope_complete'] is False for x in r['canaries'])
          assert all('PHONETIC_OR_SPELLING_WHEN_MATERIAL' in x['unresolved_dimensions'] for x in r['canaries'])
          assert all(all(e.get('federal_exact_negative_semantics_proven') is False for e in x['executions']) for x in r['canaries'])
          print('AVER_QUERY_PLAN_EXECUTION_PASS_SCOPE_INCOMPLETE')
          PY
