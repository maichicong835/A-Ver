name: A-Ver Acceptance A4

on:
  push:
    branches: [main]
    paths:
      - 'src/aver/acceptance_a4.py'
      - 'src/aver/resolvers/**'
      - '.github/workflows/acceptance-a4.yml'
  workflow_dispatch:
  create:

permissions:
  contents: read

concurrency:
  group: aver-acceptance-a4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-a4:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/heads/a4-repeatability-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVER_MODE: ACCEPTANCE_ONLY
      EXTERNAL_SIDE_EFFECTS_AUTHORIZED: 'false'
      PRODUCTION_TM_DECISIONS_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Contract preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "maichicong835/A-Ver"
          test "$AVER_MODE" = "ACCEPTANCE_ONLY"
          test "$EXTERNAL_SIDE_EFFECTS_AUTHORIZED" = "false"
          test "$PRODUCTION_TM_DECISIONS_AUTHORIZED" = "false"
          python3 tests/test_contract.py
          sha256sum CURRENT.json spec/engine.json src/aver/acceptance_a4.py src/aver/resolvers/*.py > /tmp/aver-a4-authority.before

      - name: Prepare normal browser automation transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            echo "AVER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            python3 -m playwright install chromium
          fi

      - name: Run A4 declared capability profile
        run: python3 src/aver/acceptance_a4.py

      - name: Verify authority harness and shared resolver immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum CURRENT.json spec/engine.json src/aver/acceptance_a4.py src/aver/resolvers/*.py > /tmp/aver-a4-authority.after
          diff -u /tmp/aver-a4-authority.before /tmp/aver-a4-authority.after
          git diff --exit-code -- CURRENT.json spec/engine.json docs README.md src tests .github/workflows/acceptance-a4.yml

      - name: Show compact A4 profile result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/a4/a4-receipt.json'))
          print('phase_state=',r['phase_state'])
          print('resolver_states=',json.dumps(r['resolver_states'],sort_keys=True))
          print('commit_sha=',r['repeatability_identity']['commit_sha'])
          print('run_id=',r['repeatability_identity']['run_id'])
          print('harness_revision=',r['repeatability_identity']['harness_revision'])
          print('excluded_modes_not_tested=',r['declared_capability_profile']['TMHUNT']['excluded_modes_not_tested'])
          for x in r['records']:
              print(x['resolver'],x['mode'],x['state'],x.get('failure_signature'))
          print('daily7_candidate_queries_executed=',r['daily7_candidate_queries_executed'])
          print('production_tm_decision_authorized=',r['production_tm_decision_authorized'])
          PY

      - name: Upload immutable A4 profile evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-a4-profile-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/a4/a4-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert semantic A4 profile PASS
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/a4/a4-receipt.json'))
          expected='A4_DECLARED_PROFILE_PASS'
          actual=r.get('phase_state')
          if actual != expected:
              raise SystemExit(f'A4_SEMANTIC_ACCEPTANCE_NOT_PASS:{actual}')
          print('A4_SEMANTIC_ACCEPTANCE_PASS')
          PY
