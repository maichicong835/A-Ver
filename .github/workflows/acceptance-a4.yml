name: A-Ver Acceptance A4

on:
  push:
    branches: [main]
    paths:
      - 'CURRENT.json'
      - 'spec/**'
      - 'src/aver/acceptance_a4.py'
      - 'acceptance/repeatability.trigger'
      - 'tests/**'
      - '.github/workflows/acceptance-a4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-acceptance-a4
  cancel-in-progress: true

jobs:
  acceptance-a4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVER_MODE: ACCEPTANCE_ONLY
      EXTERNAL_SIDE_EFFECTS_AUTHORIZED: 'false'
      PRODUCTION_TM_DECISIONS_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Contract preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "maichicong835/A-Ver"
          test "$AVER_MODE" = "ACCEPTANCE_ONLY"
          test "$EXTERNAL_SIDE_EFFECTS_AUTHORIZED" = "false"
          test "$PRODUCTION_TM_DECISIONS_AUTHORIZED" = "false"
          python3 tests/test_contract.py
          sha256sum CURRENT.json spec/engine.json src/aver/acceptance_a4.py > /tmp/aver-a4-authority.before

      - name: Prepare normal browser automation transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            echo "AVER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            python3 -m playwright install chromium
          fi

      - name: Run A4 fixed resolver matrix
        run: python3 src/aver/acceptance_a4.py

      - name: Verify authority and harness immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum CURRENT.json spec/engine.json src/aver/acceptance_a4.py > /tmp/aver-a4-authority.after
          diff -u /tmp/aver-a4-authority.before /tmp/aver-a4-authority.after
          git diff --exit-code -- CURRENT.json spec/engine.json docs README.md src tests .github/workflows/acceptance-a4.yml

      - name: Show compact A4 result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/a4/a4-receipt.json'))
          print('phase_state=',r['phase_state'])
          print('resolver_states=',json.dumps(r['resolver_states'],sort_keys=True))
          for x in r['records']:
              print(x['resolver'],x['mode'],x['state'],x.get('result_totals'),x.get('reported_total'),x.get('failure_signature'))
          print('production_tm_decision_authorized=',r['production_tm_decision_authorized'])
          PY

      - name: Upload immutable A4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-a4-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/a4/a4-receipt.json
          if-no-files-found: error
          retention-days: 30
