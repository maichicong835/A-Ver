name: AMA Component Diagnostic
on:
  push:
    branches: [ama-weak-core-materiality-shadow-20260918]
    paths:
      - '.github/workflows/ama-component-diagnostic.yml'
permissions:
  contents: read

jobs:
  official-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0 jsonschema==4.25.1
      - run: python3 -m playwright install --with-deps chromium
      - name: Bind AMA rights-holder component and candidate context
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts/ama-component
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          from aver.uspto_fieldtag_direct_canary import run_case
          from aver.tsdr_targeted_canary import run_case as tsdr_run
          queries=[
            {"name":"AMA_OWNER_IC016","query":"CM:AMA AND OW:\"American Medical Association\" AND LD:true AND IC:016","expected":"POSITIVE"},
            {"name":"AMA_EXACT_IC016","query":"CM:AMA AND LD:true AND IC:016","expected":"POSITIVE"},
            {"name":"LEAVE_AMA_IC016","query":"CM:LEAVE AND CM:AMA AND LD:true AND IC:016","expected":"ZERO"},
            {"name":"WORK_AMA_IC016","query":"CM:WORK AND CM:AMA AND LD:true AND IC:016","expected":"ZERO"},
            {"name":"FULL_PHRASE_EXACT","query":"CM:\"FOR THE LAST TIME, YOU CAN'T LEAVE AMA YOU WORK HERE\" AND LD:true","expected":"ZERO"}
          ]
          out={"queries":[],"tsdr":None}
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for q in queries:
                  out["queries"].append(run_case(b,q))
              out["tsdr"]=tsdr_run(b,{
                  "candidate_key":"you-cant-leave-ama",
                  "serial":"76644330",
                  "mark":"AMA",
                  "shared_component":"AMA"
              })
              b.close()
          json.dump(out,open('artifacts/ama-component/receipt.json','w'),indent=2)
          for r in out["queries"]:
              t=r.get("terminal") or {}
              print(r["name"],r["state"],r.get("failure_signature"),"count=",t.get("count"),"detail=",t.get("single_record_detail"))
          print("TSDR",out["tsdr"]["state"],out["tsdr"].get("failure_signature"),out["tsdr"].get("status_tokens"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ama-component-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/ama-component/
          if-no-files-found: error
          retention-days: 30
