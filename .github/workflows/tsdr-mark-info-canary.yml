name: A-Ver TSDR Mark Information Canary

on:
  push:
    branches: [main]
    paths:
      - 'src/aver/tsdr_mark_info_canary.py'
      - '.github/workflows/tsdr-mark-info-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-tsdr-mark-info-canary
  cancel-in-progress: false

env:
  EXTERNAL_SIDE_EFFECTS_AUTHORIZED: 'false'
  DAILY7_LIVE_GATE_AUTHORIZED: 'false'
  TM_DECISION_AUTHORIZED: 'false'

jobs:
  mark-info:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify bounded evidence locks
        shell: bash
        run: |
          set -euo pipefail
          test "$EXTERNAL_SIDE_EFFECTS_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          test "$TM_DECISION_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['status']=='PRODUCTION_APPROVED_SCOPED'
          assert c['current_reopen_scope']['new_candidate_or_market_discovery_forbidden'] is True
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          print('AVER_TSDR_MARK_INFO_LOCK_PASS')
          PY
      - name: Prepare normal browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then echo "AVER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"; else python3 -m playwright install chromium; fi
      - name: Bind official disclaimer evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/tsdr_mark_info_canary.py
      - name: Upload immutable mark-info evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aver-tsdr-mark-info-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/tsdr-mark-info/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Assert disclaimer semantic pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/tsdr-mark-info/receipt.json'))
          assert r['phase_state']=='TSDR_MARK_INFO_DISCLAIMER_PASS'
          assert r['official_source'] is True
          assert r['known_identifier_only'] is True
          assert r['candidate_breadth_expanded'] is False
          assert r['tm_decision_authorized'] is False
          assert r['daily7_live_gate_authorized'] is False
          assert r['component_strength_signal']=='DISCLAIMED_COMPONENT'
          assert r['shared_component_in_disclaimer_context'] is True
          print('AVER_TSDR_MARK_INFO_DISCLAIMER_PASS')
          PY
