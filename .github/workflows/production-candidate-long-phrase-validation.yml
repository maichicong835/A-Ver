name: A-Ver Long Phrase Production Candidate Validation
on:
  push:
    branches: [production-candidate-long-phrase-minimal-20260915]
    paths:
      - '.github/workflows/production-candidate-long-phrase-validation.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbbc878be6f1c2a4c138bef4e6c41e18fdb5f15a
          persist-credentials: false
          fetch-depth: 1
      - name: Run minimal deterministic contracts
        run: PYTHONPATH=src python3 tests/test_long_phrase_release_minimal.py

  validate-exact-candidate-pin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: h-spreadsheets-life-make-sense
            wording: MAYBE WITH ENOUGH SPREADSHEETS LIFE WILL MAKE SENSE
            require_nonmaterial_partial: 'false'
          - candidate: w-silently-creating-spreadsheet
            wording: I'M SILENTLY CREATING A SPREADSHEET FOR THAT
            require_nonmaterial_partial: 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbbc878be6f1c2a4c138bef4e6c41e18fdb5f15a
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0 jsonschema==4.25.1
      - run: python3 -m playwright install --with-deps chromium
      - name: Build exactly one bounded real-HOLD request
        env:
          CANDIDATE: ${{ matrix.candidate }}
          WORDING: ${{ matrix.wording }}
        run: |
          mkdir -p artifacts/production-candidate
          python3 - <<'PY'
          import json, os
          dims=['EXACT','NORMALIZED_EXACT','CORE_DOMINANT_TOKEN','EXPANDED_PARTIAL','PHONETIC_OR_SPELLING_WHEN_MATERIAL','RELATED_GOODS_REVIEW']
          req={'schema':'AVER_TM_REQUEST','schema_version':'1.0','request_id':os.environ['CANDIDATE'],'wording':os.environ['WORDING'],'intended_goods_context':{'primary_class':'016','description':'decorative adhesive stickers','channels':['online marketplace'],'purchasers':['US consumers']},'requested_scope':{'country':'US','federal_registry':True,'related_goods_review':True,'query_dimensions':dims},'caller':{'system':'PRODUCTION_CANDIDATE_VALIDATION','reference':'2026-09-14-1003-live-verification-fresh'}}
          json.dump(req,open('artifacts/production-candidate/request.json','w'),indent=2)
          PY
      - name: Execute exact production candidate pin on one existing HOLD
        env:
          AVER_ENGINE_COMMIT_SHA: cbbc878be6f1c2a4c138bef4e6c41e18fdb5f15a
        run: PYTHONPATH=src python3 src/aver/production_entrypoint.py --request artifacts/production-candidate/request.json --output artifacts/production-candidate/receipt.json
      - name: Assert no safety-threshold weakening
        env:
          REQUIRE_NONMATERIAL_PARTIAL: ${{ matrix.require_nonmaterial_partial }}
        run: |
          python3 - <<'PY'
          import json, jsonschema, os
          schema=json.load(open('spec/receipt.schema.json'))
          r=json.load(open('artifacts/production-candidate/receipt.json'))
          jsonschema.Draft202012Validator(schema).validate(r)
          assert r['engine_commit_sha']=='cbbc878be6f1c2a4c138bef4e6c41e18fdb5f15a', r
          assert r['decision']=='TM_PASS', r
          assert r['unresolved_dimensions']==[], r
          assert r['scope_coverage']['scope_qualified_negative_evidence_distinct_sources']>=2, r
          assert r['legal_clearance_asserted'] is False, r
          assert 'SECOND_SOURCE_GRAMMAR_UNSUPPORTED' not in r['decision_reason_codes'], r
          if os.environ['REQUIRE_NONMATERIAL_PARTIAL']=='true':
            assert 'NONMATERIAL_DEAD_UNRELATED_EXPANDED_PARTIAL_RECALL_BOUND' in r['decision_reason_codes'], r
          print('EXACT_PRODUCTION_CANDIDATE_PIN_VALIDATION_PASS',r['request_id'],r['decision_reason_codes'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aver-long-phrase-${{ matrix.candidate }}-${{ github.run_id }}-cbbc878be6f1c2a4c138bef4e6c41e18fdb5f15a
          path: artifacts/production-candidate/
          if-no-files-found: error
          retention-days: 30
