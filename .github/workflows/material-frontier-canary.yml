name: A-Ver Material Frontier Canary

on:
  push:
    branches: [main]
    paths:
      - 'src/aver/material_frontier_canary.py'
      - 'src/aver/material_record_priority.py'
      - 'src/aver/record_interpretation.py'
      - 'src/aver/record_details.py'
      - 'src/aver/record_detail_browser.py'
      - 'src/aver/goods_relatedness.py'
      - 'src/aver/similarity.py'
      - 'src/aver/resolvers/trademarkia.py'
      - '.github/workflows/material-frontier-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-material-frontier-canary
  cancel-in-progress: false

env:
  EXTERNAL_SIDE_EFFECTS_AUTHORIZED: 'false'
  DAILY7_LIVE_GATE_AUTHORIZED: 'false'
  TM_DECISION_AUTHORIZED: 'false'

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify authority locks
        shell: bash
        run: |
          set -euo pipefail
          test "$EXTERNAL_SIDE_EFFECTS_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          test "$TM_DECISION_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['status']=='PRODUCTION_APPROVED_SCOPED'
          assert c['current_reopen_scope']['only_layer']=='SHADOW_DEEP_TM_INTERPRETATION'
          assert c['current_reopen_scope']['new_candidate_or_market_discovery_forbidden'] is True
          assert c['current_reopen_scope']['only_existing_hold_canaries_authorized'] is True
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          print('AVER_MATERIAL_FRONTIER_LOCK_PASS')
          PY
      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then echo "AVER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"; else python3 -m playwright install chromium; fi
      - name: Run dynamic material frontier
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/material_frontier_canary.py
      - name: Upload immutable frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aver-material-frontier-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/deep-interpretation/frontier-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Assert frontier semantic pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/deep-interpretation/frontier-receipt.json'))
          assert r['phase_state']=='MATERIAL_FRONTIER_PASS'
          assert r['shadow_only'] is True
          assert r['candidate_breadth_expanded'] is False
          assert r['tm_decision_authorized'] is False
          assert r['daily7_live_gate_authorized'] is False
          assert all(len(x['frontier'])==2 for x in r['canaries'])
          assert all(all(y['record_machine_bound'] is True for y in x['frontier']) for x in r['canaries'])
          assert all(all(y['tm_decision'] is None and y['legal_clearance_asserted'] is False for y in x['frontier']) for x in r['canaries'])
          print('AVER_MATERIAL_FRONTIER_PASS')
          PY
