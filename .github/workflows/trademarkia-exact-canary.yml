name: A-Ver Trademarkia Exact Canary

on:
  push:
    branches: [main]
    paths:
      - 'src/aver/trademarkia_exact_canary.py'
      - '.github/workflows/trademarkia-exact-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          echo "AVER_BROWSER_EXECUTABLE=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - name: Run Trademarkia exact capability canary
        run: PYTHONPATH=src python3 src/aver/trademarkia_exact_canary.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-trademarkia-exact-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/trademarkia-exact/receipt.json
          if-no-files-found: error
          retention-days: 30
