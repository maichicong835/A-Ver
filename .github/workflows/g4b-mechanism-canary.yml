name: A-Ver G4B Mechanism Canary
on:
  push:
    branches: [main]
    paths:
      - 'src/aver/g4b_mechanism_canary.py'
      - '.github/workflows/g4b-mechanism-canary.yml'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet playwright==1.55.0
      - run: PYTHONPATH=src AVER_BROWSER_EXECUTABLE=/usr/bin/google-chrome python3 src/aver/g4b_mechanism_canary.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aver-g4b-mechanism-${{ github.run_id }}
          path: artifacts/g4b-mechanism/receipt.json
