name: A-Ver Deep Shadow Reassessment

on:
  push:
    branches:
      - 'deep-shadow-*'
    paths:
      - 'src/aver/deep_shadow_reassess.py'
      - 'src/aver/interpretation.py'
      - 'src/aver/decision.py'
      - 'tests/fixtures/record-binding-34735150433.json'
      - '.github/workflows/deep-shadow-reassess.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-deep-shadow-reassess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reassess:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CALLER_STATE_MUTATION_AUTHORIZED: 'false'
      DRIVE_MUTATION_AUTHORIZED: 'false'
      DAILY7_LIVE_GATE_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify bounded scope and locks
        shell: bash
        run: |
          set -euo pipefail
          test "$CALLER_STATE_MUTATION_AUTHORIZED" = "false"
          test "$DRIVE_MUTATION_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['current_reopen_scope']['only_layer']=='SHADOW_DEEP_TM_INTERPRETATION'
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          print('AVER_DEEP_REASSESS_LOCKS_PASS')
          PY

      - name: Reassess bound records conservatively
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/deep_shadow_reassess.py

      - name: Assert G0-G4 progress without false decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/deep-shadow-reassess/reassessment.json'))
          assert r['phase_state']=='RECORD_DETAIL_AND_G0_G4_TRIAGE_PASS_SIMILARITY_AND_SCOPE_HOLD'
          assert r['next_machine_gate']=='SIMILARITY_COMMERCIAL_IMPRESSION_AND_REMAINING_REQUIRED_QUERY_SCOPE'
          assert r['live_gate_authorized'] is False
          assert len(r['records'])==2
          assert all(x['decision']['decision']=='TM_HOLD' for x in r['records'])
          assert all(x['exact_dimension_resolved'] is False for x in r['records'])
          buckets={x['serial']:x['g0_g4_reassessment']['bucket'] for x in r['records']}
          assert buckets=={'90319838':'G1','90072046':'G3'}
          assert all(x['final_goods_relatedness']=='UNRESOLVED' for x in r['records'])
          print('AVER_DEEP_REASSESS_SEMANTIC_PASS')
          PY

      - name: Upload immutable reassessment evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-deep-shadow-reassess-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/deep-shadow-reassess/reassessment.json
          if-no-files-found: error
          retention-days: 30
