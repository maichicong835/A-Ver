name: A-Ver Daily7 Live Readiness Governor

on:
  push:
    branches: [main]
    paths:
      - 'CURRENT.json'
      - 'spec/engine.json'
      - 'spec/live-readiness.json'
      - 'spec/live-readiness-state.json'
      - 'src/aver/live_readiness.py'
      - 'src/aver/decision.py'
      - 'spec/receipt.schema.json'
      - 'tests/test_contract_matrix.py'
      - '.github/workflows/live-readiness-governor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXTERNAL_SIDE_EFFECTS_AUTHORIZED: 'false'
      DAILY7_LIVE_MUTATION_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify independent gate locks
        shell: bash
        run: |
          set -euo pipefail
          test "$EXTERNAL_SIDE_EFFECTS_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_MUTATION_AUTHORIZED" = "false"

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1

      - name: Prove decision contract on exact candidate commit
        run: python3 tests/test_contract_matrix.py

      - name: Evaluate backward live-readiness gates
        run: python3 src/aver/live_readiness.py --candidate-sha "$GITHUB_SHA" --contract-matrix-pass

      - name: Upload immutable readiness receipt
        uses: actions/upload-artifact@v4
        with:
          name: aver-live-readiness-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/live-readiness/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert workflow conclusion is not authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/live-readiness/receipt.json'))
          assert r['workflow_success_implies_live_ready'] is False
          assert r['aver_may_self_authorize_daily7_live'] is False
          assert r['live_authorized'] is False
          print('AVER_LIVE_READINESS_WORKFLOW_SEMANTICS_PASS')
          PY
