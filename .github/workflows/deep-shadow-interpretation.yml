name: A-Ver Deep Shadow Interpretation

on:
  push:
    branches:
      - 'deep-shadow-*'
    paths:
      - 'src/aver/interpretation.py'
      - 'src/aver/deep_shadow_interpret.py'
      - 'tests/test_interpretation.py'
      - 'tests/fixtures/shadow-34722878035-top-records.json'
      - '.github/workflows/deep-shadow-interpretation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-deep-shadow-interpretation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpret:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CALLER_STATE_MUTATION_AUTHORIZED: 'false'
      DRIVE_MUTATION_AUTHORIZED: 'false'
      DAILY7_LIVE_GATE_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify shadow-only locks
        shell: bash
        run: |
          set -euo pipefail
          test "$CALLER_STATE_MUTATION_AUTHORIZED" = "false"
          test "$DRIVE_MUTATION_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['current_reopen_scope']['only_layer']=='SHADOW_DEEP_TM_INTERPRETATION'
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          assert c['daily7_shadow_closure']['workflow_run_id']=='34722878035'
          print('AVER_DEEP_SHADOW_LOCKS_PASS')
          PY

      - name: Run deterministic interpretation tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 tests/test_interpretation.py

      - name: Interpret bounded machine evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/deep_shadow_interpret.py

      - name: Assert conservative semantic state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/deep-shadow/deep-interpretation.json'))
          assert r['subgate_state']=='RESULT_ROW_INTERPRETATION_PASS'
          assert r['phase_state']=='SHADOW_DEEP_TM_INTERPRETATION_HOLD_RECORD_DETAIL_AND_SCOPE'
          assert r['live_gate_authorized'] is False
          assert r['caller_state_mutation_authorized'] is False
          assert r['drive_mutation_authorized'] is False
          assert len(r['canaries'])==2
          assert all(x['tm_decision']=='TM_HOLD' for x in r['canaries'])
          assert all(x['exact_dimension_resolved'] is False for x in r['canaries'])
          print('AVER_DEEP_SHADOW_INTERPRETATION_SEMANTIC_PASS')
          PY

      - name: Upload immutable interpretation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-deep-shadow-interpretation-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/deep-shadow/deep-interpretation.json
          if-no-files-found: error
          retention-days: 30
