name: A-Ver Furm Acceptance F0-F1

on:
  push:
    branches:
      - 'class016-resolver-acceptance'
    paths:
      - 'src/aver/furm_acceptance_f0_f1.py'
      - '.github/workflows/furm-acceptance-f0-f1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f0-f1:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DAILY7_LIVE_GATE_AUTHORIZED: 'false'
      DAILY7_STATE_MUTATION_AUTHORIZED: 'false'
      DRIVE_MUTATION_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify acceptance isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          test "$DAILY7_STATE_MUTATION_AUTHORIZED" = "false"
          test "$DRIVE_MUTATION_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['status']=='PRODUCTION_APPROVED_SCOPED'
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          print('AVER_FURM_ACCEPTANCE_ISOLATION_PASS')
          PY

      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            echo "AVER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            python3 -m playwright install chromium
          fi

      - name: Run Furm transport and known-record binding only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/furm_acceptance_f0_f1.py

      - name: Assert no candidate query and bounded semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/furm-f0-f1/receipt.json'))
          assert r['acceptance_only'] is True
          assert r['candidate_queries_executed'] is False
          assert r['daily7_live_gate_authorized'] is False
          assert r['external_side_effects_authorized'] is False
          if r['phase_state'] not in ('FURM_F0_F1_PASS','FURM_F0_F1_PARTIAL'):
              raise SystemExit('FURM_F0_F1_UNKNOWN_STATE')
          print('AVER_FURM_F0_F1_SEMANTIC_PASS')
          PY

      - name: Upload immutable Furm F0-F1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-furm-f0-f1-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/furm-f0-f1/receipt.json
          if-no-files-found: error
          retention-days: 30
