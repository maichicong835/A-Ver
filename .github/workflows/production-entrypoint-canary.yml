name: A-Ver Production Entrypoint Canary
on:
  push:
    branches: [main, capability-release-long-phrase-shadow-20260914]
    paths:
      - 'src/aver/production_entrypoint.py'
      - 'src/aver/production.py'
      - 'src/aver/query_plan.py'
      - 'src/aver/decision.py'
      - 'src/aver/resolvers/**'
      - 'src/aver/uspto_fieldtag_direct_canary.py'
      - 'spec/request.schema.json'
      - 'spec/receipt.schema.json'
      - 'tests/test_long_phrase_query_surface.py'
      - 'tests/shadow_probe_uspto_problem_query.py'
      - 'tests/fixtures/capability_release/**'
      - '.github/workflows/production-entrypoint-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0 jsonschema==4.25.1
      - run: python3 -m playwright install --with-deps chromium
      - name: Build fixed non-Daily7 production requests
        run: |
          mkdir -p artifacts/production-entrypoint
          python3 - <<'PY'
          import json
          dims=['EXACT','NORMALIZED_EXACT','CORE_DOMINANT_TOKEN','EXPANDED_PARTIAL','PHONETIC_OR_SPELLING_WHEN_MATERIAL','RELATED_GOODS_REVIEW']
          def req(i,w): return {'schema':'AVER_TM_REQUEST','schema_version':'1.0','request_id':i,'wording':w,'intended_goods_context':{'primary_class':'016','description':'decorative adhesive stickers','channels':['online marketplace'],'purchasers':['US consumers']},'requested_scope':{'country':'US','federal_registry':True,'related_goods_review':True,'query_dimensions':list(dims)},'caller':{'system':'G6B_CANARY','reference':'fixed-non-daily7'}}
          json.dump(req('g6b.pass','Quietly Off Course'),open('artifacts/production-entrypoint/pass-request.json','w'),indent=2)
          hold=req('g6b.hold.scope-incomplete','Quietly Off Course Today Somehow')
          hold['requested_scope']['query_dimensions'].remove('RELATED_GOODS_REVIEW')
          json.dump(hold,open('artifacts/production-entrypoint/hold-request.json','w'),indent=2)
          PY
      - name: Execute generic production entrypoint wrapper
        env:
          AVER_ENGINE_COMMIT_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=src python3 src/aver/production_entrypoint.py --request artifacts/production-entrypoint/pass-request.json --output artifacts/production-entrypoint/pass-receipt.json
          PYTHONPATH=src python3 src/aver/production_entrypoint.py --request artifacts/production-entrypoint/hold-request.json --output artifacts/production-entrypoint/hold-receipt.json
      - name: Assert utility and deterministic fail-closed semantics
        run: |
          python3 - <<'PY'
          import json, jsonschema, os
          schema=json.load(open('spec/receipt.schema.json'))
          a=json.load(open('artifacts/production-entrypoint/pass-receipt.json')); b=json.load(open('artifacts/production-entrypoint/hold-receipt.json'))
          jsonschema.Draft202012Validator(schema).validate(a); jsonschema.Draft202012Validator(schema).validate(b)
          assert a['engine_commit_sha']==os.environ['GITHUB_SHA'] and b['engine_commit_sha']==os.environ['GITHUB_SHA']
          assert a['decision']=='TM_PASS', a
          assert a['scope_coverage']['scope_qualified_negative_evidence_distinct_sources']>=2
          assert a['unresolved_dimensions']==[]
          assert b['decision']=='TM_HOLD', b
          assert 'REQUEST_SCOPE_MISSING_REQUIRED_DIMENSIONS' in b['decision_reason_codes'], b
          assert 'RELATED_GOODS_REVIEW' in b['unresolved_dimensions'], b
          assert a['legal_clearance_asserted'] is False and b['legal_clearance_asserted'] is False
          print('AVER_PRODUCTION_ENTRYPOINT_UTILITY_AND_DETERMINISTIC_FAIL_CLOSED_PASS')
          PY
      - name: Reproduce bounded long-phrase query surface
        if: github.ref_name == 'capability-release-long-phrase-shadow-20260914'
        run: PYTHONPATH=src python3 tests/test_long_phrase_query_surface.py
      - uses: actions/upload-artifact@v4
        with:
          name: aver-production-entrypoint-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/production-entrypoint/
          if-no-files-found: error
          retention-days: 30

  shadow-existing-hold-fresh-runner:
    if: github.ref_name == 'capability-release-long-phrase-shadow-20260914'
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: h-spreadsheets-life-make-sense
            request: tests/fixtures/capability_release/h-spreadsheets-life-make-sense.json
          - candidate: w-silently-creating-spreadsheet
            request: tests/fixtures/capability_release/w-silently-creating-spreadsheet.json
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0 jsonschema==4.25.1
      - run: python3 -m playwright install --with-deps chromium
      - name: Execute exactly one existing HOLD on a fresh runner
        env:
          AVER_ENGINE_COMMIT_SHA: ${{ github.sha }}
          CANDIDATE: ${{ matrix.candidate }}
          REQUEST: ${{ matrix.request }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/shadow-fresh-runner
          PYTHONPATH=src python3 src/aver/production_entrypoint.py \
            --request "$REQUEST" \
            --output "artifacts/shadow-fresh-runner/${CANDIDATE}.receipt.json"
      - name: Validate exact shadow receipt without weakening decision policy
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python3 - <<'PY'
          import json, jsonschema, os
          path=f"artifacts/shadow-fresh-runner/{os.environ['CANDIDATE']}.receipt.json"
          r=json.load(open(path)); schema=json.load(open('spec/receipt.schema.json'))
          jsonschema.Draft202012Validator(schema).validate(r)
          assert r['engine_commit_sha']==os.environ['GITHUB_SHA'], r
          assert r['legal_clearance_asserted'] is False, r
          assert 'SECOND_SOURCE_GRAMMAR_UNSUPPORTED' not in r['decision_reason_codes'], r
          assert 'SECOND_SOURCE_CORE_GRAMMAR_UNSUPPORTED' not in r['decision_reason_codes'], r
          print('SHADOW_EXISTING_HOLD_FRESH_RUNNER',os.environ['CANDIDATE'],r['decision'],r['decision_reason_codes'],r['unresolved_dimensions'],r['scope_coverage'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aver-shadow-existing-hold-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/shadow-fresh-runner/
          if-no-files-found: error
          retention-days: 30

  shadow-w-expanded-partial-probe:
    if: github.ref_name == 'capability-release-long-phrase-shadow-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet playwright==1.55.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Isolate W secondary expanded-partial query on fresh runner
        run: |
          mkdir -p artifacts/problem-query
          PYTHONPATH=src python3 tests/shadow_probe_uspto_problem_query.py
      - uses: actions/upload-artifact@v4
        with:
          name: aver-shadow-w-expanded-partial-probe-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/problem-query/
          if-no-files-found: error
          retention-days: 30
