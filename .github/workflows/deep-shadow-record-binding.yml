name: A-Ver Deep Shadow Record Binding

on:
  push:
    branches:
      - 'deep-shadow-*'
    paths:
      - 'src/aver/record_binding.py'
      - 'src/aver/deep_shadow_record_binding.py'
      - '.github/workflows/deep-shadow-record-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aver-deep-shadow-record-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bind-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CALLER_STATE_MUTATION_AUTHORIZED: 'false'
      DRIVE_MUTATION_AUTHORIZED: 'false'
      DAILY7_LIVE_GATE_AUTHORIZED: 'false'
    steps:
      - name: Checkout exact A-Ver commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify bounded scope and locks
        shell: bash
        run: |
          set -euo pipefail
          test "$CALLER_STATE_MUTATION_AUTHORIZED" = "false"
          test "$DRIVE_MUTATION_AUTHORIZED" = "false"
          test "$DAILY7_LIVE_GATE_AUTHORIZED" = "false"
          python3 - <<'PY'
          import json
          c=json.load(open('CURRENT.json'))
          assert c['current_reopen_scope']['only_layer']=='SHADOW_DEEP_TM_INTERPRETATION'
          assert c['current_reopen_scope']['daily7_live_gate_authorized'] is False
          print('AVER_DEEP_RECORD_BINDING_LOCKS_PASS')
          PY

      - name: Bind only targeted public record details
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/aver/deep_shadow_record_binding.py

      - name: Assert conservative decision boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/deep-shadow-record-binding/record-binding.json'))
          assert r['target_scope']=='EXACTLY_TWO_INTERPRETATION_SURVIVOR_RECORDS'
          assert r['new_candidate_discovery_executed'] is False
          assert r['caller_state_mutation_authorized'] is False
          assert r['drive_mutation_authorized'] is False
          assert r['live_gate_authorized'] is False
          assert r['tm_decision']=='TM_HOLD'
          assert len(r['records'])==2
          assert {x['serial'] for x in r['records']}=={'90319838','90072046'}
          print('AVER_DEEP_RECORD_BINDING_SEMANTIC_PASS')
          PY

      - name: Upload immutable record binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: aver-deep-shadow-record-binding-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/deep-shadow-record-binding/record-binding.json
          if-no-files-found: error
          retention-days: 30
